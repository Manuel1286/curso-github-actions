userName: ${BROWSERSTACK_USER}
accessKey: ${BROWSERSTACK_KEY}
platforms:
  - deviceName: Samsung Galaxy S23 Ultra
    osVersion: 13.0
    browserName: chrome
    deviceOrientation: portrait
  - deviceName: iPhone 15 Pro Max
    osVersion: 17
    browserName: safari
    deviceOrientation: portrait
  - browserName: Chrome
    os: Windows
    osVersion: 11
    browserVersion: 115.0
parallelsPerPlatform: 1
browserstackLocal: false
buildName: ${browserstack-build-name}
projectName: ${browserstack-project-name}
testContextOptions:
  skipSessionName: true
buildIdentifier: null
debug: false
networkLogs: false
consoleLogs: errors
testObservability: false
geoLocation: CO
testOrchestrationOptions:
  retryTestsOnFailure:
    enabled: true
    maxRetries: 2
  runPreviouslyFailedFirst: true
  abortBuildOnFailure:
    enabled: true
browserstackAutomation: true