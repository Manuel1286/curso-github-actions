name: Expresiones
run-name: ¡Estoy aprendiendo a usar Expresiones!

on:
  push:
    branches:
      - pruebas-pr
  workflow_dispatch:
    inputs:
      edad:
        description: Edad
        required: true
        default: 30
        type: number
      name:
        description: Nombre
        required: true
        default: 'Manuel'
        type: string

jobs:

  mayor:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.edad >= 18 }}
    runs-on: ubuntu-latest

    steps:
      - name: Correr script
        run: echo "${{ inputs.name }} es mayor de edad"

  menor:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.edad < 18 }}
    runs-on: ubuntu-latest

    steps:
      - name: Correr script
        run: echo "${{ inputs.name }} es menor de edad"