name: Expresiones
run-name: ¡Estoy aprendiendo a usar Expresiones!

on:
  push:
    branches:
      - pruebas-pr

  workflow_dispatch:

    edad_1: 20

    inputs:
      edad:
        description: 'Edad'
        required: true
        default: edad_1
        type: integer

      name:
        description: 'Nombre'
        required: true
        default: 'Manuel'
        type: string

jobs:

  mayor:
    if: ${{ inputs.edad >= 18 }}
    runs-on: ubuntu-latest

    steps:
      - name: Correr script
        run: echo "${{ inputs.name }} es mayor de edad"

  menor:
    if: ${{ inputs.edad < 18 }}
    runs-on: ubuntu-latest

    steps:
      - name: Correr script
        run: echo "${{ inputs.name }} es menor de edad"
