name: Ejecutar Proyecto Java con Gradle

on:
  push:
    branches:
      - main
      - curso-github-actions
      - feature/**

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Compilar proyecto
        run: ./gradlew build

      - name: Ejecutar aplicación
        run: ./gradlew run
