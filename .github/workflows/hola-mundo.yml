name: Aprendiendo GitHub Actions

on:
  push:

jobs:
  hola-mundo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dar permisos a gradlew
        run: chmod +x gradlew

      - name: Ejecutar aplicación
        run: ./gradlew run
