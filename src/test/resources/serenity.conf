serenity {
  project.name = Pruebas E2E Banco de Bogota
  console.colors=true
  logging = "VERBOSE"
  serenity.take.screenshots.for = FOR_FAILURES
  serenity.take.screenshots.for = FOR_EACH_ACTION
}

webdriver.driver = appium
environment = android

environments {
    all {
        appium.autoWebview = true
        appium.newCommandTimeout = 20000
    }
    android {
        appium.platformName = "Android"
        appium.deviceName = "emulator-5554"
        appium.appPackage = "com.bancodebogota.bancamovilSTG"
        appium.appActivity = "io.ionic.starter.MainActivity"
        appium.automationName = "UiAutomator2"
        appium.noReset = true
        appium.unicodeKeyboard = true
        appium.resetKeyboard = true
    }
}
